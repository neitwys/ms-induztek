spring.application.name=api-gateway
server.port=8090

spring.cloud.gateway.server.webflux.routes[0].id=ruta-ms-autenticacion
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ms-autenticacion
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/autenticacion,/api/autenticacion/**,/uploads/**

spring.cloud.gateway.server.webflux.routes[1].id=ruta-ms-notificaciones
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ms-notificaciones
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/notificaciones,/api/notificaciones/**

spring.cloud.gateway.server.webflux.routes[2].id=ruta-ms-clientes
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ms-clientes
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/empresas,/api/empresas/**

spring.cloud.gateway.server.webflux.routes[3].id=ruta-ms-pruebas
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ms-pruebas
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/pruebas,/api/pruebas/**

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.hostname=api-gateway
eureka.instance.instance-id=api-gateway:${server.port}

logging.level.org.springframework.cloud.gateway=DEBUG