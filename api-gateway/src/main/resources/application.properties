spring.application.name=api-gateway
server.port=8090

spring.cloud.gateway.server.webflux.routes[0].id=ruta-ms-autenticacion
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ms-autenticacion
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/autenticacion,/api/autenticacion/**,/uploads/**

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.hostname=api-gateway
eureka.instance.instance-id=api-gateway:${server.port}

logging.level.org.springframework.cloud.gateway=DEBUG